name: Runtime compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install into a fresh store
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/dsh-pnpm-store"
      - run: pnpm run check:runtime
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Install the complete official npm Host
        run: |
          DSH_VERSION=$(node -p "require('./package.json').dependencies['@deepseek-ai/dsh']")
          npm install --prefix "$RUNNER_TEMP/dsh-host" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
      - name: Smoke test the official npm Host
        run: DSH_TEST_CLI="$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js" pnpm run test:smoke

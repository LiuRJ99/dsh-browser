name: Sync Upstream

on:
  schedule:
    # 每天北京时间 10:00 自动检查一次 (UTC 02:00)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Lum1104/dsh-browser.git || true
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="main"
          fi
          echo "Target branch: $TARGET_BRANCH"

          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Behind count: $BEHIND_COUNT"
          echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT

          if [ "$BEHIND_COUNT" -gt 0 ]; then
            COMMITS=$(git log HEAD..upstream/main --oneline -n 25)
            echo "COMMITS<<EOF" >> $GITHUB_ENV
            echo "$COMMITS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Create or update sync branch and PR
        if: steps.check.outputs.behind_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="main"
          fi
          SYNC_BRANCH="sync/upstream-main"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$SYNC_BRANCH" upstream/main
          git push origin "$SYNC_BRANCH" --force

          PR_TITLE="chore(sync): sync upstream Lum1104/dsh-browser (main)"
          PR_BODY=$(cat <<EOF
          ## Upstream Sync Report

          Detected **${{ steps.check.outputs.behind_count }}** new commit(s) from upstream \`Lum1104/dsh-browser:main\`.

          ### New Commits Preview:
          \`\`\`text
          ${COMMITS}
          \`\`\`

          ---
          *Auto-generated by GitHub Actions. Review the diff and merge when ready.*
          EOF
          )

          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists. Updating..."
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            echo "Creating new PR..."
            gh pr create --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          fi
